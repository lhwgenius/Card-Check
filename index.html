const msel=()=>`<div class="card" style="padding:12px 16px"><div class="h"><span style="font-size:16px">조회 월</span>${sel()}</div></div>`;
const cur=()=>MON===DATA.month;
function tab0(d){let h=msel();if(!d)return h+'<div class="card"><div class="empty">이 달의 기록이 없어요</div></div>';if(cur()&&d.recommendation)h+=`<div class="ban" style="margin-top:12px"><small>오늘 쓸 카드</small><b>${d.recommendation.card}</b>${d.recommendation.reason}</div>`;
for(const c of d.cards.filter(c=>!isB(c))){const n=c.transactions.filter(t=>t.ok!==false).length,T=c.tiers||[],b=ben(c.key),cur=T.filter(t=>t.reached).pop();
h+=`<div class="card${OPEN[c.key]?' open':''}" onclick="tog('${c.key}')"><div class="h"><span>${c.name}</span><span class="s">${c.last4?'•••• '+c.last4+' ':''}<span class="chev">▾</span></span></div>`;
h+=`<div class="s">실적 인정 금액</div><div class="tot">${w(c.total)}</div>${c.auto_note?`<div class="s">🏠 ${c.auto_note}</div>`:''}${c.reported&&c.reported.incomplete?`<div class="s">📱 ${c.reported.label} 기준 (${c.reported.as_of.slice(5).replace('-','/')} 확인)</div>`:''}`;
if(T.length){const max=T[T.length-1].min;h+=`<div class="bar"><i style="width:${Math.min(c.total/max*100,100)}%"></i>${T.slice(0,-1).map(t=>`<u style="left:${t.min/max*100}%"></u>`).join('')}</div>`;
for(const t of T){const sh=b&&(b.tiers.find(x=>x.min_krw===t.min)||{}).short;h+=`<div class="tl${t===cur?' on':''}"><b>${t.min/10000}만${c.target===t.min&&c.target_active?'(목표)':''}</b>${sh?` <span class=sh>${sh}</span>`:''} — ${t.reached?'<span class=ok>달성</span>':'<b>'+man(t.remaining)+'</b> 남음'}</div>`;}
if(c.target&&!c.target_active)h+=`<div class="s">목표 ${w(c.target)} 관리 · ${c.target_start.replace(/(\d+)-0?(\d+)/,'$1년 $2월')}부터</div>`;}
h+=`<div class="s">${n?`이번 달 ${n}건`:'아직 결제 알림이 없어요'} · 눌러서 혜택 보기</div>`;
h+=`<div class="det">${b?detail(b,cur):'<div class="s">혜택 정보 없음</div>'}</div></div>`;}
if(d.ev&&d.ev.length){h+=`<div class="card"><div class="h"><span>⚡ 전기차 충전 할인</span></div>`;for(const e of d.ev){const pm=e.prev_month.replace(/.*-0?/,'')+'월';h+=`<div style="margin-top:10px"><div class="h" style="margin:0"><span style="font-size:15px">${e.name}</span><span class="s">${e.rate?Math.round(e.rate*100)+'% · 한도 '+w(e.cap):'할인 없음'}</span></div>`;
h+=e.rate?`<div class="bar"><i style="width:${Math.min(e.used/e.cap*100,100)}%"></i></div><div class="s">남은 한도 <b style="color:#333">${w(e.left)}</b>${e.pending>0?' <span style="color:#c2410c">(확정 전 '+w(e.pending)+' 포함)</span>':''} · 할인 ${w(e.used)} 사용 (충전 ${e.count}건 ${w(e.spent)})</div>`:`<div class="s">${pm} 실적 ${e.prev_total==null?'기록 없음':w(e.prev_total)} · ${man(e.tiers[0][0])} 이상이면 할인</div>`;
if(e.rate)h+=`<div class="s">${pm} 실적 ${w(e.prev_total)} 기준</div>`;h+=`</div>`}
h+=`<div class="s" style="margin-top:10px">결제일 할인이라 예상액이에요 · 파워큐브는 후불정산 결제 시 할인</div></div>`}
return h}
function detail(b,cur){let h=`<div class="s" style="font-weight:700;color:#333">${b.card}</div>${b.annual_fee?`<div class="s" style="margin-top:2px">연회비: ${b.annual_fee}</div>`:''}`;
for(const r of b.tiers){const on=cur&&cur.min===r.min_krw;h+=`<div class="tier${on?' on':''}"><b>전월 ${w(r.min_krw)}${r.max_krw?' ~ '+w(r.max_krw+1)+' 미만':' 이상'}</b>${on?' <span class=ok>← 지금</span>':''}<ul>${r.benefits.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;}
if(b.note)h+=`<div class="s">※ ${b.note}</div>`;
return h+`<div class="ex">실적 제외<ul>${b.exclusions.map(x=>'<li>'+x+'</li>').join('')}</ul></div><div class="src">출처: ${b.source_url} · 신뢰도: ${b.confidence}</div>`}
function allTx(d){return d.cards.flatMap(c=>c.transactions.map(t=>({...t,card:c.key,cname:c.name,l4:t.last4||c.last4,bank:isB(c)})))}
const dt=(s,o)=>{const x=new Date(s);if(o)return `${x.getMonth()+1}/${x.getDate()}`;return `${x.getMonth()+1}/${x.getDate()} ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`};
function tab1(d){if(!d)return msel()+'<div class="card"><div class="empty">이 달의 기록이 없어요</div></div>';const ut=c=>{const s=c.transactions.reduce((a,t)=>a+t.amount,0);return c.reported&&c.reported.total>s?c.reported.total:s},all=d.cards.filter(c=>!isB(c)).flatMap(c=>c.transactions),tot=d.cards.filter(c=>!isB(c)).reduce((a,c)=>a+ut(c),0);
let h=msel()+`<div class="card"><div class="s">${d.month.replace('-','년 ')}월 전체 사용 · ${all.length}건</div><div class="tot">${w(tot)}</div></div>`;
for(const c of d.cards.filter(c=>!isB(c))){const L=[...c.transactions].sort((a,b)=>b.time<a.time?-1:1),ct=ut(c),inc=c.reported&&c.reported.incomplete,k='u_'+c.key;
h+=`<div class="card${OPEN[k]?' open':''}" onclick="tog('${k}')"><div class="h"><span>${c.name}</span><span class="s">${c.last4?'•••• '+c.last4+' ':''}<span class="chev">▾</span></span></div>`;
h+=`<div class="s">${cur()?'이번 달':d.month.replace(/.*-0?/,'')+'월'} 사용 · ${L.length}건</div><div class="tot">${w(ct)}</div>${(()=>{const X=L.filter(t=>t.ok===false),xs=X.reduce((a,t)=>a+t.amount,0);return X.length?`<div class="s" style="color:#c2410c">실적 제외 ${X.length}건 · ${w(xs)}</div>`:''})()}${inc?`<div class="s">📱 ${c.reported.label} 기준 · 확인된 내역 ${L.length}건뿐이에요</div>`:''}`;
h+=`<div class="s">${L.length?'눌러서 사용내역 보기':(inc?'세부 내역은 아직 없어요':'아직 사용내역이 없어요')}</div>${L.length?`<div class="det">`+L.map(t=>`<div class="tx"><div><div class="l">${t.merchant||t.category}${t.ok===false?' <span style="font-size:11px;font-weight:700;color:#c2410c;background:#ffedd5;border-radius:6px;padding:1px 6px;margin-left:4px">실적 제외</span>':''}</div><div class="m">${dt(t.time,t.date_only)}${t.last4&&t.last4!==c.last4?' · '+t.last4:''}${t.merchant?' · '+t.category:''}</div>${t.memo?`<div class="m">📝 ${t.memo}</div>`:''}</div><div class="amt" style="${t.amount<0?'color:#c2410c':''}">${w(t.amount)}</div></div>`).join('')+'</div>':''}</div>`;}
return h}
function catv(d,L){const c=CATV,I=L.filter(t=>(CATS.includes(t.category)?t.category:'기타')===c).sort((a,b)=>b.time<a.time?-1:1),tot=I.reduce((s,t)=>s+t.amount,0),i=CATS.indexOf(c);
let h=`<div class="card" style="padding:12px 16px"><div class="h"><button onclick="cv(null)" style="border:0;background:#eef0f5;border-radius:10px;padding:8px 12px;font-size:15px">‹ 뒤로</button>${sel()}</div></div>`;
h+=`<div class="card"><div class="h"><span><i style="display:inline-block;width:12px;height:12px;border-radius:6px;background:${COL[i]};margin-right:6px"></i>${c}</span><span class="s">${I.length}건</span></div><div class="s">${d.month.replace('-','년 ')}월</div><div class="tot">${w(tot)}</div></div>`;
h+=`<div class="card">${I.length?I.map(t=>`<div class="tx"><div><div class="l">${t.merchant||c}</div><div class="m">${dt(t.time,t.date_only)} · ${t.cname}${t.l4?' '+t.l4:''}</div>${t.memo?`<div class="m">📝 ${t.memo}</div>`:''}</div><div class="amt" style="${t.amount<0?'color:#c2410c':''}">${w(t.amount)}</div></div>`).join(''):'<div class="empty">이 분류의 내역이 없어요</div>'}</div>`;return h}
function tab2(d){if(!d)return msel()+'<div class="card"><div class="empty">이 달의 기록이 없어요</div></div>';const L=allTx(d).filter(t=>t.category!=='카드대금');
const by={};CATS.forEach(c=>by[c]=0);L.forEach(t=>by[CATS.includes(t.category)?t.category:'기타']+=t.amount);
if(CATV)return catv(d,L);const S=L.filter(t=>t.category!=='저축'),tot=SP.reduce((a,c)=>a+by[c],0),mx=Math.max(1,...SP.map(c=>by[c])),ct=S.filter(t=>!t.bank).reduce((a,t)=>a+t.amount,0),bt=S.filter(t=>t.bank).reduce((a,t)=>a+t.amount,0);
let h=`<div class="card"><div class="h"><span>지출</span>${sel()}</div><div class="tot">${w(tot)}</div><div class="s">카드·계좌 출금 기준 · 카드대금·페이 충전·내 계좌 이체·저축은 빼고 계산</div></div>`;
h+=`<div class="card${OPEN.split?' open':''}" onclick="tog('split')"><div class="h"><span style="font-size:16px">카드 · 현금 지출 보기</span><span class="chev">▾</span></div><div class="det"><div class="row"><span class="n">💳 카드</span><span class="v" style="flex:1;font-weight:700">${w(ct)}</span></div><div class="row"><span class="n" style="width:110px">🏦 현금(계좌)</span><span class="v" style="flex:1;font-weight:700">${w(bt)}</span></div><div class="s" style="color:#16a34a">🐷 저축 ${w(by['저축'])} (지출에서 제외)</div></div></div>`;
h+=`<div class="card"><div class="h"><span>분류별</span></div>${CATS.map((c,i)=>c==='저축'?'':`<div class="row" style="cursor:pointer" onclick="cv('${c}')"><span class="n">${c}</span><span class="b"><i style="width:${Math.max(by[c],0)/mx*100}%;background:${COL[i]}"></i></span><span class="v">${man(Math.max(by[c],0)).replace(/ /g,'')}</span><span style="color:#aaa;flex:none">›</span></div>`).join('')}<div class="row" style="cursor:pointer;border-top:1px dashed #ddd;padding-top:8px" onclick="cv('저축')"><span class="n" style="color:#16a34a">🐷 저축</span><span class="s" style="flex:1;margin:0">지출 합계에서 빠져요</span><span class="v" style="color:#16a34a;width:auto">${man(by["저축"]).replace(/ /g,"")}</span><span style="color:#aaa;flex:none">›</span></div><div class="s">분류를 누르면 내역을 볼 수 있어요</div></div>`;
const [y,m]=d.month.split('-').map(Number),nd=new Date(y,m,0).getDate(),day=Array(nd).fill(0);S.forEach(t=>{day[new Date(t.time).getDate()-1]+=t.amount});
const dm=Math.max(1,...day);h+=`<div class="card"><div class="h"><span>일별</span></div><div class="cols">${day.map(v=>`<i style="height:${Math.max(v,0)/dm*100}%"></i>`).join('')}</div><div class="axis"><span>1일</span><span>15일</span><span>${nd}일</span></div>`;
const wk=[];day.forEach((v,i)=>{const k=Math.floor((i+new Date(y,m-1,1).getDay())/7);wk[k]=(wk[k]||0)+v});const wm=Math.max(1,...wk);
h+=`<div class="h" style="margin-top:14px"><span>주별</span></div>${wk.map((v,i)=>`<div class="row"><span class="n">${i+1}주차</span><span class="b"><i style="width:${Math.max(v,0)/wm*100}%;background:#1f3b73"></i></span><span class="v">${man(Math.max(v,0)).replace(/ /g,'')}</span></div>`).join('')}</div>`;
return h}
function draw(){const d=MD[MON]===0?null:(MD[MON]||(MON===DATA.month?DATA:null));if(MD[MON]===undefined&&MON!==DATA.month)return mon(MON);if(MD[MON]==='L'){document.getElementById('app').innerHTML=msel()+'<div class="card"><div class="empty">불러오는 중…</div></div>';return}let h=[tab0,tab1,tab2][TAB](d);const u=new Date((d||DATA).updated_at);
h+=`<div class="up">마지막 업데이트: ${u.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})} (한국 시간)</div>`;
document.getElementById('app').innerHTML=h;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',+b.dataset.t===TAB))}
function cv(c){CATV=c;draw();scrollTo(0,0)}function tog(k){OPEN[k]=!OPEN[k];draw()}function fil(k){FIL=k;draw()}
function mon(m){MON=m;if(MD[m]==='L')return;if(MD[m])return draw();if(MD[m]===0)return draw();MD[m]='L';fetch('data-'+m+'.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(x=>{MD[m]=x;draw()}).catch(()=>{MD[m]=0;draw()})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{TAB=+b.dataset.t;CATV=null;draw();scrollTo(0,0)});
const q=new URLSearchParams(location.search);if(q.get('tab'))TAB=+q.get('tab');if(q.get('open'))q.get('open').split(',').forEach(k=>OPEN[k]=1);
MON=EMB.month;MD[MON]=EMB;if(q.get('m'))MON=q.get('m');if(q.get('cat'))CATV=q.get('cat');draw();
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d;MD[d.month]=d;if(!q.get('m')&&(!MON||MON===EMB.month))MON=d.month;draw()}).catch(()=>{});
fetch('benefits.json?'+Date.now()).then(r=>r.json()).then(b=>{BEN=b;draw()}).catch(()=>{});
fetch('months.json?'+Date.now()).then(r=>r.json()).then(m=>{MONTHS=m;draw()}).catch(()=>{});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=13');
</script></body></html>
